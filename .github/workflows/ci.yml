name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `src/generated/` is derived from node_modules and deliberately not
      # committed, so it has to exist before anything reads its types.
      - name: Assemble generated sources
        run: npm run assemble

      - name: Typecheck
        run: npx tsc --noEmit

      # The machine the agent's commands run on. It is 400 MB of converted
      # container and it changes only when `container/` does, so it is cached on
      # a hash of its own sources and only built when that misses. A miss is a
      # long job: the converter compiles Bochs, wasi-vfs, and wizer from source.
      - name: Restore the machine
        id: machine
        uses: actions/cache@v4
        with:
          path: public/container
          key: machine-${{ hashFiles('container/**', 'scripts/build-container.mjs') }}

      - name: Free disk space for the conversion
        if: steps.machine.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build the machine
        if: steps.machine.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: npm run build:container

      - name: Build
        run: npm run build

      - name: End-to-end
        # Boot, client plugin roster, the container's shell and git, and
        # durability across a reload. The model turn is skipped without a key.
        run: |
          npx playwright install --with-deps chromium
          node scripts/serve.mjs 4173 &
          sleep 3
          npx tsx scripts/e2e.ts

      - name: Runtime workloads
        # Runs bash, git, Python, and Node in the container, on a real pty, and
        # checks the agent and the terminal are one machine.
        timeout-minutes: 45
        run: |
          node scripts/serve.mjs 4175 &
          sleep 3
          npx tsx scripts/runtime-e2e.ts --url http://127.0.0.1:4175/

      - name: Plugin compatibility
        # Installs real community plugins from npm into the built app. Runs only
        # on the default branch: it reaches the network for every package.
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/serve.mjs 4174 &
          sleep 3
          npx tsx scripts/plugin-e2e.ts --url http://127.0.0.1:4174/ || true

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/dshw-*.png
          if-no-files-found: ignore

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./shell/favicon.svg" />
    <title>DeepSeek Harness</title>
    <script>
      // The current dsh packages use modern UUID, object, response,
      // cancellation/deferred and explicit-resource-management helpers.
      // Without these small equivalents an iPhone can draw the shell (and even
      // the direct Files panel) while every client request — including
      // workspace, provider and preset loading — repeatedly disconnects. This
      // classic script runs before the module graph, including dependencies
      // that use computed symbol keys while evaluating.
      if (typeof crypto.randomUUID !== 'function') {
        Object.defineProperty(Crypto.prototype, 'randomUUID', {
          configurable: true,
          writable: true,
          value: function () {
            var bytes = new Uint8Array(16)
            this.getRandomValues(bytes)
            bytes[6] = (bytes[6] & 15) | 64
            bytes[8] = (bytes[8] & 63) | 128
            var hex = ''
            for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0')
            return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16)
              + '-' + hex.slice(16, 20) + '-' + hex.slice(20)
          },
        })
      }
      if (typeof Object.hasOwn !== 'function') {
        Object.hasOwn = function (object, property) {
          if (object === null || object === undefined) throw new TypeError('Object.hasOwn called on null or undefined')
          return Object.prototype.hasOwnProperty.call(object, property)
        }
      }
      if (typeof Response.json !== 'function') {
        Object.defineProperty(Response, 'json', {
          configurable: true,
          writable: true,
          value: function (data, init) {
            var body = JSON.stringify(data)
            if (body === undefined) throw new TypeError('Response.json could not serialize the supplied value')
            var options = init === undefined ? {} : init
            var headers = new Headers(options.headers)
            if (!headers.has('content-type')) headers.set('content-type', 'application/json')
            return new Response(body, {
              status: options.status,
              statusText: options.statusText,
              headers: headers,
            })
          },
        })
      }
      if (typeof Symbol.dispose !== 'symbol') {
        Object.defineProperty(Symbol, 'dispose', { value: Symbol.for('Symbol.dispose') })
      }
      if (typeof Symbol.asyncDispose !== 'symbol') {
        Object.defineProperty(Symbol, 'asyncDispose', { value: Symbol.for('Symbol.asyncDispose') })
      }
      if (typeof Promise.withResolvers !== 'function') {
        Promise.withResolvers = function () {
          var resolve
          var reject
          var promise = new this(function (resolvePromise, rejectPromise) {
            resolve = resolvePromise
            reject = rejectPromise
          })
          return { promise: promise, resolve: resolve, reject: reject }
        }
      }
      if (typeof AbortSignal.any !== 'function') {
        AbortSignal.any = function (iterable) {
          var signals = Array.from(iterable)
          var controller = new AbortController()
          var listeners = []
          var abortFrom = function (signal) {
            for (var i = 0; i < listeners.length; i++) {
              listeners[i][0].removeEventListener('abort', listeners[i][1])
            }
            listeners = []
            controller.abort(signal.reason)
          }
          for (var i = 0; i < signals.length; i++) {
            if (signals[i].aborted) {
              abortFrom(signals[i])
              break
            }
            var listener = abortFrom.bind(undefined, signals[i])
            listeners.push([signals[i], listener])
            signals[i].addEventListener('abort', listener, { once: true })
          }
          return controller.signal
        }
      }
      if (typeof AbortSignal.timeout !== 'function') {
        AbortSignal.timeout = function (delay) {
          var milliseconds = Number(delay)
          if (!Number.isFinite(milliseconds) || milliseconds < 0) {
            throw new TypeError('AbortSignal.timeout requires a non-negative finite delay')
          }
          var controller = new AbortController()
          setTimeout(function () {
            var reason
            try {
              reason = new DOMException('The operation timed out.', 'TimeoutError')
            } catch (_error) {
              reason = new Error('The operation timed out.')
              reason.name = 'TimeoutError'
            }
            controller.abort(reason)
          }, milliseconds)
          return controller.signal
        }
      }
      if (typeof AbortSignal.prototype.throwIfAborted !== 'function') {
        AbortSignal.prototype.throwIfAborted = function () {
          if (!this.aborted) return
          if (this.reason !== undefined) throw this.reason
          throw new DOMException('The operation was aborted.', 'AbortError')
        }
      }

      // Bootstrap placeholder. Bundled dependencies read `process.platform`
      // while their module bodies evaluate, which happens before any of this
      // app's own modules run — so the object has to exist here, in a classic
      // script. `src/node/process.ts` merges the full implementation onto this
      // same object, keeping one identity for anything that captured it early.
      globalThis.process = globalThis.process || {
        env: { NODE_ENV: 'production' },
        platform: 'linux',
        arch: 'wasm32',
        argv: ['/usr/bin/node', '/usr/bin/dsh'],
        version: 'v22.0.0',
        versions: {},
        cwd: function () { return '/workspace' },
        nextTick: function (fn) { queueMicrotask(fn) },
        emitWarning: function () {},
        on: function () { return globalThis.process },
        once: function () { return globalThis.process },
        off: function () { return globalThis.process },
      }
      globalThis.global = globalThis.global || globalThis
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
